  backGlow.material.color.set(t > DROP && t < OUTRO ? 0xff6a3d : t >= OUTRO ? 0x7a5cff : 0xff7a2a);
  backGlow.position.copy(camera.position).addScaledVector(camera.getWorldDirection(new THREE.Vector3()), 22);

  key.intensity = 1.1 + .4 * kickPulse; amb.intensity = .06 + .15 * prog(t, OUTRO, OUTRO + 1);
  bloom.strength = .55 + .35 * kickPulse + (t > HIT - .3 && t < HIT + .3 ? .5 : 0);

  composer.render();

  // ---------- DOM layer ----------
  css($('presents'), prog(t, .3, .9) * (1 - prog(t, 1.4, 1.9)), `translateY(${(1 - eOut(prog(t, .3, .9))) * 30}px)`);
  for (const c of CAPS) {
    const k = prog(t, c.t0 - .25, c.t0 + .15) * (1 - prog(t, c.t1, c.t1 + .3));
    css(c.el, k, `translateY(${(1 - eOut(prog(t, c.t0 - .25, c.t0 + .2))) * 60}px) scale(${.94 + .06 * eOut(prog(t, c.t0 - .25, c.t0 + .2))})`);
    if (k > 0) c.bars.forEach((b, i) => { b.style.height = (4 + 22 * clamp(vo(t) * (.5 + .5 * Math.abs(Math.sin(i * 1.7 + t * 9)))) ) + 'px'; });
  }
  const tk = prog(t, DROP + .7, DROP + 1.2) * (1 - prog(t, OUTRO - .4, OUTRO));
  css($('t-en'), tk, `translateY(${(1 - eOut(prog(t, DROP + .7, DROP + 1.2))) * 40}px)`);
  css($('t-sub'), prog(t, DROP + 1.1, DROP + 1.6) * (1 - prog(t, OUTRO - .4, OUTRO)), '');
  const oK = (a) => eOut(prog(t, OUTRO + a, OUTRO + a + .6));
  css($('brand'), oK(.7), `translateY(${(1 - oK(.7)) * 50}px)`);
  css($('hd'), oK(1.0), `translateY(${(1 - oK(1.0)) * 40}px)`);
  css($('svc'), oK(1.25), '');
  css($('cta'), oK(1.5), `translateX(-50%) scale(${.9 + .1 * spring(prog(t, OUTRO + 1.5, OUTRO + 2.5) * 2)})`);
  const hdr = prog(t, 1.0, 1.8) * (1 - prog(t, OUTRO, OUTRO + .5));
  css($('header'), hdr, `translateY(${(1 - eOut(prog(t, 1, 1.8))) * -30}px)`);
  css($('footer'), prog(t, 1.0, 1.8), '');
  const fl = Math.max(Math.exp(-Math.max(0, t - HIT) * 7) * (t >= HIT - .06 ? 1 : 0) * .95, Math.exp(-Math.max(0, t - DROP) * 6) * (t >= DROP ? 1 : 0) * .8, Math.exp(-Math.max(0, t - OUTRO) * 6) * (t >= OUTRO ? 1 : 0) * .5);
  css($('flash'), fl < .01 ? 0 : fl, '');
  css($('fade'), Math.max(1 - prog(t, 0, .5), prog(t, DUR - .5, DUR)), '');
}
window.renderFrame = f => frame(f);
window.ready = init().then(() => { frame(0); return true; });
</script>
</body></html>
