<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#000;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;color:#f5f5f7;overflow:hidden;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.75}
.b1{width:620px;height:620px;background:#5ee7ff;left:-180px;top:120px;opacity:.45}
.b2{width:700px;height:700px;background:#9b7bff;right:-220px;top:380px;opacity:.55}
.b3{width:520px;height:520px;background:#ff5ecf;left:240px;bottom:-200px;opacity:.45}
.wave{position:absolute;left:0;top:560px;width:1080px;opacity:.9}
.top{position:absolute;top:80px;left:80px;right:80px;display:flex;align-items:center;gap:22px}
.top svg{width:84px;height:84px}
.top span{font-size:44px;font-weight:700;letter-spacing:-1px}
.pill{margin-left:auto;font-size:22px;font-weight:600;letter-spacing:3px;padding:12px 24px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22)}
.card{position:absolute;left:80px;right:80px;bottom:150px;padding:64px 60px;border-radius:56px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.25);backdrop-filter:blur(40px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 40px 80px rgba(0,0,0,.5)}
h1{font-size:96px;line-height:1.02;font-weight:800;letter-spacing:-3px}
h1 em{font-style:normal;background:linear-gradient(90deg,#5ee7ff,#9b7bff,#ff5ecf);-webkit-background-clip:text;color:transparent}
p{margin-top:28px;font-size:36px;line-height:1.35;color:rgba(245,245,247,.78)}
.tags{display:flex;gap:16px;margin-top:40px;flex-wrap:wrap}
.tags div{font-size:26px;font-weight:600;padding:14px 26px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)}
.foot{position:absolute;bottom:60px;left:80px;right:80px;display:flex;justify-content:space-between;font-size:24px;color:rgba(245,245,247,.6)}
.foot b{color:#f5f5f7;font-weight:600}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<svg class="wave" viewBox="0 0 1080 300"><defs><linearGradient id="w" x1="0" x2="1"><stop offset="0" stop-color="#5ee7ff"/><stop offset=".5" stop-color="#9b7bff"/><stop offset="1" stop-color="#ff5ecf"/></linearGradient></defs>
<path d="M0 150H260l40-110 60 220 50-170 40 80H1080" fill="none" stroke="url(#w)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="top"><svg viewBox="0 0 120 120">  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset="0.5" stop-color="#9b7bff"/>
      <stop offset="1" stop-color="#ff5ecf"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <!-- squircle tile -->
  <path d="M60 4c40 0 56 16 56 56s-16 56-56 56S4 100 4 60 20 4 60 4z" fill="url(#bg)"/>
  <path d="M60 4c40 0 56 16 56 56s-16 56-56 56S4 100 4 60 20 4 60 4z" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <!-- heartbeat pulse that turns into a route arrow -->
  <path d="M18 64h14l7-20 10 40 9-30 6 10h22" fill="none" stroke="url(#stroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M82 52l12 12-12 12" fill="none" stroke="#ff5ecf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>BPMroute</span><div class="pill">COMING SOON</div></div>
<div class="card"><h1>Your music.<br><em>Routed everywhere.</em></h1>
<p>Distribution, AI mastering and production tools for independent artists. All in one place.</p>
<div class="tags"><div>Start free</div><div>AI mastering</div><div>Global distribution</div></div></div>
<div class="foot"><b>bpmroute.com</b><span>by EKSTAC33 Production</span></div>
</body></html>
